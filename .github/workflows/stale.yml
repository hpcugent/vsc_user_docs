# This workflow warns and then closes issues and PRs that 
# have had no activity for a specified amount of time.
# The workflow has been tested on the incubator site.
# You can adjust the behavior by modifying this file.
# For more information, see:
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  workflow_dispatch: 
  schedule:
  - cron: '02 16 * * *'


jobs:
  stale:

    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
    - uses: actions/stale@v11.0.0
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        stale-issue-message: > 
          This issue has been automatically marked as stale because
          it has not had recent activity. 
          It will be closed if no further activity occurs. 
          Thank you for your contributions.
        stale-pr-message: > 
          This issue has been automatically marked as stale because
          it has not had recent activity.
          It will be closed if no further activity occurs.
          Thank you for your contributions.
        stale-issue-label: 'wontfix'
        stale-pr-label: 'wontfix'
        close-issue-label: 'declined'
        days-before-stale: 300
        days-before-close: 60
        exempt-issue-labels: notstale
        exempt-pr-labels: notstale
